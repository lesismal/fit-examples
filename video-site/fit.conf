# A video site behind fit: films in a media library played on demand over
# HLS (vod), a channel that plays them round the clock as a live stream,
# and playback URLs that expire. The site's own API (video-site/api) logs
# viewers in and asks media_tokens, on the loopback and behind basic_auth,
# for a URL signed for each viewer; fit checks every playlist and segment
# against it. Staff log in to fit's own library and player pages at
# /media/library as staff, password example-password.
# Make the films and run it from the repository's root, then open
# http://localhost:8080/ and log in as alice, password example-password:
#   video-site/make-media.sh
#   go run ./video-site/api &
#   fit run -c video-site/fit.conf
# 一个位于 fit 之后的视频网站：媒体库中的影片以 HLS 点播（vod），一个频道把
# 它们当作直播全天播放，播放地址会过期。网站自己的 API（video-site/api）让
# 观众登录，并向只在本机、受 basic_auth 保护的 media_tokens 为每个观众申请
# 签名地址；fit 按地址检查每个播放列表和分片。工作人员以 staff（密码
# example-password）登录 fit 自己的片库和播放页面 /media/library。
# 生成影片后在仓库根目录运行，然后打开 http://localhost:8080/，以 alice
# （密码 example-password）登录：
#   video-site/make-media.sh
#   go run ./video-site/api &
#   fit run -c video-site/fit.conf
listener web :8080 http/1.1 h2c

media_library films {
	roots video-site/media
}

media_auth site {
	# Signs the playback URLs; replace it with a long random secret of your
	# own. media_tokens rotates the file to revoke every URL signed with it.
	# 用于签名播放地址；请换成你自己的足够长的随机密钥。media_tokens 轮换
	# 这个文件即可吊销用它签名的所有地址。
	secret_file video-site/secret
	# The staff of fit's own pages; the site's viewers are the API's.
	# fit 自己页面的工作人员；网站的观众由 API 管理。
	users staff {
		password_hash $2a$10$gkDJyGagxp1q7R24F0rSjulsgZOFL55Zm6JK2RcxTCLDk23szhZA2
		play *
	}
	url_signing {
		# A URL dies soon; a player that started plays on, on the grant its
		# playlist hands it, for the film's length and play_grace more.
		# 地址很快过期；已开始的播放器凭播放列表交给它的授权继续播放，
		# 授权的时长是影片长度再加 play_grace。
		ttl 2m
		play_grace 30m
		# Two players a viewer at once; a third ends the first.
		# 每个观众最多同时两个播放器；第三个会结束最早的那个。
		max_sessions 2
		on_limit end_oldest
	}
}

streaming {
	channels {
		name tv/films
		library films
		items films/testcard films/bars
	}
}

upstream site-api { addresses 127.0.0.1:8090 }

# /vod/films/films/testcard/index.m3u8, for the URL signed for it.
# /vod/films/films/testcard/index.m3u8，需带为它签名的地址参数。
route vod {
	match { path /vod/* }
	handler vod { library films; auth site; segment_duration 4s }
}

# /hls/tv/films/index.m3u8: the channel.
# /hls/tv/films/index.m3u8：频道。
route channels {
	match { path /hls/* }
	handler hls { prefix /hls/; auth site }
}

# Only the site's API signs URLs: from the loopback, with its password.
# 只有网站的 API 能签名地址：仅限本机，并需要它的密码。
route tokens {
	match {
		path /media-tokens /media-tokens/*
		remote_ip 127.0.0.1/32 ::1/128
	}
	middleware basic_auth {
		users {
			username site-api
			password_hash $2a$10$gkDJyGagxp1q7R24F0rSjulsgZOFL55Zm6JK2RcxTCLDk23szhZA2
		}
	}
	handler media_tokens {
		auth site
		url_prefixes /vod/films/ /hls/tv/
		max_ttl 1h
	}
}

route api {
	match { path /api/* }
	handler proxy { upstream site-api }
}

# fit's own pages for the staff: the library, a player, and hls.js at
# /media/vendor/hls.min.js, which the site's page loads too.
# fit 自己给工作人员用的页面：片库、播放器，以及 /media/vendor/hls.min.js
# 上的 hls.js，网站的页面也加载它。
route staff {
	match { path /media /media/* }
	handler media_pages {
		auth site
		login true
		title "Video site staff"
		libraries films
		channels true
		hls /hls/{stream}/index.m3u8
	}
}

# The site's page.
# 网站的页面。
route site {
	priority -1
	handler static { root video-site/web; index index.html }
}
