# How routes match: by path, method, header, query, client address, regular
# expression or an expression of them; priority breaks ties.
# Run it from the repository's root: fit run -c routing/fit.conf
# 路由如何匹配：按路径、方法、请求头、查询参数、客户端地址、正则表达式，或它们
# 组成的表达式；priority 用于打破平局。
# 在仓库根目录运行：fit run -c routing/fit.conf
listener web :8080 http/1.1 h2c

# A path prefix and methods.
# 一个路径前缀和若干方法。
route api-write {
	match { path /api/*; method POST PUT DELETE }
	handler respond { body "api write\n" }
}

# A header with one of its values, and a query parameter with any value.
# 一个请求头取其值之一，以及一个取任意值的查询参数。
route beta {
	match { path /api/*; header { X-Channel beta canary }; query { preview } }
	handler respond { body "beta\n" }
}

# The client's address, as the connection has it.
# 客户端地址，以连接所见为准。
route internal {
	match { path /internal/*; remote_ip 127.0.0.0/8 10.0.0.0/8 }
	handler respond { body "internal\n" }
}

# A regular expression on the path.
# 路径上的正则表达式。
route versioned {
	match { path_regexp ^/v[0-9]+/ }
	handler respond { body "versioned\n" }
}

# Matchers combined; an expression needs a priority to win over hosts and paths.
# 组合匹配器；表达式需要 priority 才能胜过主机和路径。
route expr {
	priority 10
	match { expr "PathPrefix(\"/admin/\") && !RemoteIP(\"10.0.0.0/8\")" }
	handler respond { status 403; body "admin is internal only\n" }
}

route not-found {
	priority -1
	handler respond { status 404; body "not found\n" }
}
