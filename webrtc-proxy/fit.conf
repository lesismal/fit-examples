# WebRTC media servers behind fit: WHIP and WHEP offers are load balanced
# over the media servers, and every peer's media relayed to the one that
# answered it through fit's single UDP port, 8190.
# Run it from the repository's root: fit run -c webrtc-proxy/fit.conf
# fit 后面的 WebRTC 媒体服务器：WHIP 和 WHEP offer 在媒体服务器之间负载均衡，
# 每个 peer 的媒体通过 fit 的单个 UDP 端口 8190 中继到应答它的那台媒体服务器。
# 在仓库根目录运行：fit run -c webrtc-proxy/fit.conf
listener web :8080 http/1.1 h2c

upstream media-servers 10.0.0.2:8080 10.0.0.3:8080 {
	health_check { path /healthz }
}

route webrtc {
	match { path /whip/* /whep/* }
	handler webrtc_proxy {
		upstream media-servers
		# Where a media server's peers are relayed to, when its answer's
		# candidates do not say it well.
		# 当媒体服务器应答中的 candidate 说不清楚时，其 peer 中继到这些地址。
		media_addrs { 10.0.0.3:8080 10.0.0.3:8189 }
		timeout 10s
	}
}

webrtc {
	proxy {
		listen :8190
		public_ips 203.0.113.5
		max_sessions 4096
		# A firewall in front of the media servers admits these ports.
		# 媒体服务器前面的防火墙放行这些端口。
		port_min 40000
		port_max 40999
	}
}
