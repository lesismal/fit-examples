# A WebAssembly plugin on each request, on a pool of its own: continue.wasm
# lets every request through (continue.wat is its source); build a real one
# from Go with plugin/wasm/guest, or use a Proxy-Wasm filter.
# Run it from the repository's root: fit run -c wasm/fit.conf
# 每个请求经过一个 WebAssembly 插件，插件运行在自己的池上：continue.wasm
# 放行所有请求（continue.wat 是其源码）；可以用 plugin/wasm/guest 从 Go 构建
# 真正的插件，或使用 Proxy-Wasm 过滤器。
# 在仓库根目录运行：fit run -c wasm/fit.conf
listener web :8080 http/1.1 h2c

route filtered {
	middleware wasm {
		# Relative to the directory fit runs in.
		# 相对于 fit 运行时所在的目录。
		path wasm/continue.wasm
		# A string the plugin reads, for settings of its own.
		# 插件读取的一个字符串，用于它自己的设置。
		config "{\"deny\": [\"/admin\"]}"
		# 4 instances, each with its own memory, up to 64 MiB.
		# 4 个实例，各有自己的内存，最多 64 MiB。
		instances 4
		max_memory_bytes 64MiB
		queue 1024
		timeout 50ms
		wait_timeout 1s
		# A plugin that fails lets the request go on rather than answer 500.
		# 插件失败时让请求继续，而不是应答 500。
		on_error skip
	}
	handler respond { body "passed the plugin\n" }
}
