# Listeners, routes, upstreams and services from etcd: each key under fit/
# holds a JSON object of them, as a config does, e.g.
#   etcdctl put fit/app '{"routes": [{"handler": {"module": "respond"}}]}'
# Run it from the repository's root: fit run -c provider-etcd/fit.conf
# 来自 etcd 的监听器、路由、上游和服务：fit/ 下的每个键保存一个包含它们的
# JSON 对象，与配置文件中的写法相同，例如
#   etcdctl put fit/app '{"routes": [{"handler": {"module": "respond"}}]}'
# 在仓库根目录运行：fit run -c provider-etcd/fit.conf
listener web :8080 http/1.1 h2c

provider etcd {
	etcd {
		# Each member, tried in turn when one fails.
		# 每个成员，一个失败时依次尝试下一个。
		endpoints http://10.0.0.71:2379 http://10.0.0.72:2379 http://10.0.0.73:2379
		prefix fit/
		max_keys 1000
		request_timeout 10s
	}
}
