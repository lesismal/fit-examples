# PHP through PHP-FPM: each path runs its own script when there is one, and
# everything else runs index.php, the front controller most PHP applications
# want. Static assets are better served by the static handler, on a route of
# their own (see static).
# Run it from the repository's root: fit run -c fastcgi/fit.conf
# 通过 PHP-FPM 运行 PHP：每个路径有对应脚本时运行该脚本，其他一律运行
# index.php，即大多数 PHP 应用需要的前端控制器。静态资源最好由 static 处理器
# 在单独的路由上提供（见 static）。
# 在仓库根目录运行：fit run -c fastcgi/fit.conf
listener web :8080 http/1.1 h2c

route php {
	handler fastcgi {
		# PHP-FPM's socket; "127.0.0.1:9000" for one on TCP.
		# PHP-FPM 的 socket；使用 TCP 时为 "127.0.0.1:9000"。
		address unix//run/php/php-fpm.sock
		# The document root as PHP-FPM sees it.
		# PHP-FPM 看到的文档根目录。
		root /srv/app/public
		# /index.php/a/b runs /index.php with PATH_INFO /a/b.
		# /index.php/a/b 会以 PATH_INFO /a/b 运行 /index.php。
		split_path .php
		try_files {path} {path}/index.php /index.php
		# More FastCGI parameters, after fit's own.
		# 更多 FastCGI 参数，排在 fit 自己的参数之后。
		env { APP_ENV production }
		# At most 32 requests at PHP-FPM at once, 8 idle connections kept.
		# 同时最多 32 个请求发往 PHP-FPM，保留 8 个空闲连接。
		max_conns 32
		max_idle_conns 8
		max_pending 512
		response_header_timeout 60s
		timeout 5m
	}
}
