# fit's streaming role: a stream published once, over RTMP, RTSP, SRT or WHIP,
# plays over all of them and over HTTP-FLV, HLS and WHEP. Anyone may play;
# publishing takes the studio token (here "test": use your own, and its
# sha256sum) or alice's password.
# Run it from the repository's root: fit run -c streaming/fit.conf
# fit 的流媒体角色：一路流只需推一次（RTMP、RTSP、SRT 或 WHIP），即可通过这些
# 协议以及 HTTP-FLV、HLS 和 WHEP 播放。任何人都可以播放；推流需要 studio token
# （这里是 "test"：请换成你自己的，并填它的 sha256sum）或 alice 的密码。
# 在仓库根目录运行：fit run -c streaming/fit.conf
listener web :8080 http/1.1 h2c

media_auth live {
	public play
	# Publish over RTMP with the token in the query:
	# ffmpeg -re -i in.mp4 -c copy -f flv "rtmp://host/live/cam?token=test"
	# 通过 RTMP 推流，token 放在查询参数里：
	# ffmpeg -re -i in.mp4 -c copy -f flv "rtmp://host/live/cam?token=test"
	tokens studio {
		token_sha256 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
		publish live/*
	}
	# RTSP's Digest needs the password itself: rtsp://alice:alice-password@host:8554/alice/cam
	# RTSP 的 Digest 认证需要明文密码：rtsp://alice:alice-password@host:8554/alice/cam
	users alice { password alice-password; publish alice/*; play * }
}

streaming {
	max_streams 32
	max_players 200
	rtmp { listen :1935; auth live }
	rtsp { listen :8554; auth live }
	# Publish over SRT with the token as the stream ID's s=:
	# ffmpeg ... -f mpegts "srt://host:8890?streamid=#!::r=live/cam,m=publish,s=test"
	# 通过 SRT 推流，token 放在 stream ID 的 s= 里：
	# ffmpeg ... -f mpegts "srt://host:8890?streamid=#!::r=live/cam,m=publish,s=test"
	srt { listen :8890; auth live; latency 200ms }
	webrtc { listen :8188 }
}

# /live/cam.flv plays live/cam as HTTP-FLV, or WebSocket-FLV to an upgrade.
# /live/cam.flv 以 HTTP-FLV 播放 live/cam，收到 upgrade 请求时则用 WebSocket-FLV。
route flv {
	match { path /live/* /alice/* }
	handler httpflv { auth live; cors * }
}

# /hls/live/cam/index.m3u8, and ?format=ts for MPEG-TS segments.
# /hls/live/cam/index.m3u8；加 ?format=ts 得到 MPEG-TS 分片。
route hls { match { path /hls/* }; handler hls { prefix /hls/; auth live } }
route whip { match { path /whip/* }; handler stream_whip { auth live } }
route whep { match { path /whep/* }; handler stream_whep { auth live } }
