# fit as a Kubernetes Gateway API controller and Ingress controller: the
# Gateways of its GatewayClass, their HTTPRoutes, GRPCRoutes, TLSRoutes,
# TCPRoutes and UDPRoutes, and Ingresses of its IngressClass. Outside the
# cluster, it reads ~/.kube/config. kubernetes runs it with the Helm
# chart in kind.
# Run it from the repository's root: fit run -c provider-kubernetes/fit.conf
# The Gateways' listeners come from the cluster; this one answers the
# kubelet's probes, as fit's Helm chart sets it up.
# fit 作为 Kubernetes Gateway API 控制器和 Ingress 控制器：处理其 GatewayClass
# 的 Gateway，以及它们的 HTTPRoute、GRPCRoute、TLSRoute、TCPRoute 和 UDPRoute，
# 还有其 IngressClass 的 Ingress。在集群外，它读取 ~/.kube/config。示例 kubernetes
# 用 Helm chart 在 kind 中运行它。
# 在仓库根目录运行：fit run -c provider-kubernetes/fit.conf
# Gateway 的监听器来自集群；这一个回应 kubelet 的探针，与 fit 的 Helm chart 的
# 设置一致。
listener health :8081 http/1.1

route healthz {
	listeners health
	match { path /healthz }
	handler respond { body "ok\n" }
}

provider k8s {
	kubernetes {
		# GatewayClasses with this controllerName are fit's.
		# 带此 controllerName 的 GatewayClass 归 fit 所有。
		controller_name lesismal.github.io/fit
		namespaces default apps
		# Send to the Services' ready endpoints, balanced by fit.
		# 发往 Service 的就绪端点，由 fit 做负载均衡。
		backends endpoints
		max_objects 10000
		# Written into each Gateway's status.addresses.
		# 写入每个 Gateway 的 status.addresses。
		addresses 203.0.113.10
		ingress { http_port 80; https_port 443 }
		# Where the TLS Secrets' certificates are written for fit to load.
		# TLS Secret 的证书写到这里，供 fit 加载。
		certificates_dir /var/lib/fit/k8s-certs
	}
}
