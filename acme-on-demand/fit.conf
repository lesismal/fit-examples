# Certificates obtained on demand, during the TLS handshake, for any name a
# client asks for (a SaaS with customers' own domains): an ask URL of yours
# says which names may have one, and rate and count limits bound the rest.
# Run it from the repository's root: fit run -c acme-on-demand/fit.conf
# 证书在 TLS 握手期间按需获取，适用于客户端请求的任何名称（例如托管客户自有
# 域名的 SaaS）：由你的 ask URL 决定哪些名称可以获取证书，其余由速率和数量
# 限制约束。
# 在仓库根目录运行：fit run -c acme-on-demand/fit.conf
listener https :443 http/1.1 h2 {
	tls {
		# Names known ahead are obtained at start; others on demand.
		# 事先已知的名称在启动时获取；其他名称按需获取。
		acme app.example.com
		on_demand true
	}
}

# HTTP-01 challenges are answered on port 80.
# HTTP-01 质询在 80 端口应答。
listener http :80 http/1.1

route tenants {
	listeners https
	handler respond { body "a customer's site\n" }
}

route to-https {
	listeners http
	middleware redirect { to https://{host}{uri}; status 308 }
	handler respond { status 404 }
}

acme {
	email ops@example.com
	on_demand {
		# fit asks GET http://127.0.0.1:5555/allowed?domain=<name>: 2xx allows it.
		# fit 会请求 GET http://127.0.0.1:5555/allowed?domain=<name>：返回 2xx 即允许。
		ask http://127.0.0.1:5555/allowed
		# At most 10 new certificates a minute, 5000 names in all.
		# 每分钟最多 10 张新证书，总共 5000 个名称。
		rate 10
		interval 1m
		max_names 5000
		# A name no handshake asked for in a week is dropped.
		# 一周内没有任何握手请求过的名称会被移除。
		idle_timeout 168h
	}
}
