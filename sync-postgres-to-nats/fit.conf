# PostgreSQL's changes to NATS JetStream: a snapshot of the tables, then
# logical replication, each change published to the subject
# cdc.<schema>.<table> in Debezium's format, with a Nats-Msg-Id made from
# its position, so that the stream's duplicate window drops what a restart
# sends again. A second pipeline reads the stream back through a durable
# pull consumer, its sequence in the checkpoint, into a search index. The
# stream (subjects cdc.>) is yours; PG_PASSWORD, NATS_PASSWORD and
# ES_PASSWORD hold the passwords. Run it from the repository's root:
#   PG_PASSWORD=... NATS_PASSWORD=... ES_PASSWORD=... fit run -c sync-postgres-to-nats/fit.conf
# PostgreSQL 的变更写入 NATS JetStream：先读表的快照，再经逻辑复制读取，
# 每个变更以 Debezium 格式发布到 cdc.<schema>.<table> 主题，带上由其位置
# 生成的 Nats-Msg-Id，所以重启后再次发送的消息会被流的去重窗口丢弃。第二条
# 流水线经持久的拉取消费者读回该流（序号保存在检查点里），写入搜索索引。
# 流（主题 cdc.>）由你创建；PG_PASSWORD、NATS_PASSWORD 和 ES_PASSWORD 保存
# 密码。在仓库根目录运行：
#   PG_PASSWORD=... NATS_PASSWORD=... ES_PASSWORD=... fit run -c sync-postgres-to-nats/fit.conf
sync {
	state_dir /tmp/fit-example-sync

	pipelines shop-to-nats {
		source postgres {
			address db.internal:5432
			user repl
			password_env PG_PASSWORD
			database shop
			create true
			publication fit_shop_nats
			slot fit_shop_nats
			tables public.orders
		}
		sinks nats {
			sink nats {
				servers nats-1:4222 nats-2:4222 nats-3:4222
				username fit
				password_env NATS_PASSWORD
				subject cdc.{namespace}
				codec debezium
			}
		}
	}

	pipelines nats-to-search {
		source nats {
			servers nats-1:4222 nats-2:4222 nats-3:4222
			username fit
			password_env NATS_PASSWORD
			stream CDC
			# Made when missing; a message is acknowledged once the
			# index has it.
			# 缺失时创建；消息在索引拿到后才确认。
			consumer fit-search
			create_consumer true
			codec debezium
		}
		sinks search {
			sink elasticsearch {
				urls https://es-1:9200
				username fit
				password_env ES_PASSWORD
				index "{namespace}"
			}
		}
	}
}

admin { address 127.0.0.1:2019 }
