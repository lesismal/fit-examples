# A fixed response on port 8080, and 404 for any other path.
# Run it from the repository's root: fit run -c hello/fit.conf
# Try it: curl http://127.0.0.1:8080/hello
# 在 8080 端口返回固定响应，其他路径返回 404。
# 在仓库根目录运行：fit run -c hello/fit.conf
# 试一下：curl http://127.0.0.1:8080/hello
listener web {
	address :8080
	protocols http/1.1 h2c
}

route hello {
	match {
		path /hello
	}
	handler respond {
		body "hello from fit\n"
	}
}

route not-found {
	priority -1
	handler respond {
		status 404
		body "not found\n"
	}
}
