# Forward authentication: each request is first asked about at an auth
# service (Authelia, oauth2-proxy, Authentik and the like); a 2xx answer lets
# it through with the user's fields, any other answer goes back to the client.
# Run it from the repository's root: fit run -c forward-auth/fit.conf
# 转发认证：每个请求先向认证服务（Authelia、oauth2-proxy、Authentik 等）询问；
# 2xx 应答会放行请求并带上用户字段，其他应答则返回给客户端。
# 在仓库根目录运行：fit run -c forward-auth/fit.conf
listener web :8080 http/1.1 h2c

upstream auth 127.0.0.1:9091
upstream app 127.0.0.1:9000

route app {
	middleware forward_auth {
		upstream auth
		uri /api/verify
		# Only what the auth service needs to decide.
		# 只传认证服务做决定所需的内容。
		request_headers Cookie Authorization
		# Copied from its answer onto the request the app gets.
		# 从其应答中复制到应用收到的请求上。
		copy_headers Remote-User Remote-Groups Remote-Email
		timeout 5s
	}
	handler proxy { upstream app }
}
