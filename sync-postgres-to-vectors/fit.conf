# PostgreSQL's articles kept in vector databases for semantic search: a
# snapshot, then logical replication, each insert and update given a
# vector of its title and body by the embed transform, through an
# OpenAI-compatible embeddings API (this config's llm.proxy when url is
# left out), cached by the text's hash so that a replay or an update of
# other columns asks for nothing; then upserted into Qdrant by an ID from
# the key and into Milvus by its primary key, deletes deleting. The
# collections are yours, with vectors of the model's size (1536 here).
# PG_PASSWORD, OPENAI_API_KEY, QDRANT_API_KEY and MILVUS_TOKEN hold the
# credentials. Run it from the repository's root:
#   PG_PASSWORD=... OPENAI_API_KEY=... QDRANT_API_KEY=... MILVUS_TOKEN=... fit run -c sync-postgres-to-vectors/fit.conf
# 把 PostgreSQL 的文章保存在向量数据库中，用于语义搜索：先读快照，再经逻辑复制
# 读取，每条插入和更新由 embed 变换经兼容 OpenAI 的 embeddings API（不设置 url
# 时为本配置的 llm.proxy）为其标题和正文计算向量，按文本的哈希缓存，所以重放或
# 只改了其他列的更新不会再请求；然后按由键生成的 ID upsert 到 Qdrant，按主键
# upsert 到 Milvus，删除则删除。集合由你创建，向量维数与模型相同（这里为
# 1536）。PG_PASSWORD、OPENAI_API_KEY、QDRANT_API_KEY 和 MILVUS_TOKEN 保存凭据。
# 在仓库根目录运行：
#   PG_PASSWORD=... OPENAI_API_KEY=... QDRANT_API_KEY=... MILVUS_TOKEN=... fit run -c sync-postgres-to-vectors/fit.conf
sync {
	state_dir /tmp/fit-example-sync

	pipelines articles-to-vectors {
		source postgres {
			address db.internal:5432
			user repl
			password_env PG_PASSWORD
			database cms
			create true
			publication fit_articles
			slot fit_articles
			tables public.articles
		}
		transforms embed {
			url https://api.openai.com/v1
			model text-embedding-3-small
			api_key_env OPENAI_API_KEY
			fields title body
			into embedding
			batch_records 64
			max_parallel 4
		}
		sinks qdrant {
			sink qdrant {
				url https://qdrant.internal:6333
				api_key_env QDRANT_API_KEY
				collection articles
				payload id title author
			}
			batch { max_records 256; max_wait 500ms }
		}
		sinks milvus {
			sink milvus {
				url https://milvus.internal:19530
				token_env MILVUS_TOKEN
				collection articles
				primary_key id
				fields title author embedding
			}
			batch { max_records 256; max_wait 500ms }
		}
	}
}

admin { address 127.0.0.1:2019 }
