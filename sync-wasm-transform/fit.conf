# A sync pipeline through a WebAssembly transform of your own: users.ndjson
# read as rows, the plugin dropping test accounts and hiding emails, the
# rest written to standard output. Nothing but fit is needed. Build the
# plugin, then run the pipeline once, from the repository's root:
#   GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o sync-wasm-transform/users.wasm ./sync-wasm-transform/plugin
#   fit sync run -c sync-wasm-transform/fit.conf --once users
# 经过自己编写的 WebAssembly 变换的同步流水线：users.ndjson 按行读入，插件
# 丢弃测试账号并隐藏邮箱，其余记录写到标准输出。除 fit 外不需要别的。先构建
# 插件，再在仓库根目录把流水线运行一次：
#   GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o sync-wasm-transform/users.wasm ./sync-wasm-transform/plugin
#   fit sync run -c sync-wasm-transform/fit.conf --once users
sync {
	# Each pipeline's checkpoint is kept here, as <name>.json.
	# 每条流水线的检查点保存在这里，文件名为 <name>.json。
	state_dir /tmp/fit-example-sync

	pipelines users {
		# Each line a JSON object, read as a row.
		# 每行一个 JSON 对象，读作一行数据。
		source file {
			paths sync-wasm-transform/users.ndjson
			codec json
		}
		transforms key { fields id }
		# The plugin reads its config as a string of its own; a call that
		# traps or runs past timeout fails its records, as on_error says.
		# 插件把 config 当作自己的字符串读取；陷入 trap 或超过 timeout 的调用
		# 会让其记录失败，按 on_error 处理。
		transforms wasm {
			path sync-wasm-transform/users.wasm
			config "{\"drop_domain\": \"example.test\"}"
			instances 2
			timeout 500ms
		}
		sinks out { sink stdout }
		# A record the plugin fails goes to dead letters in state_dir, which
		# fit sync dead-letters lists and replays.
		# 插件处理失败的记录进入 state_dir 中的死信，可用 fit sync dead-letters
		# 列出和重放。
		on_error dead_letter
		dead_letter { name errors; sink dead_letters }
	}
}
