# Log files to Elasticsearch, as Filebeat ships them: JSON lines tailed from
# /var/log/app, across rotations, into a daily index. The checkpoint (each
# file's identity and offset) is saved only once Elasticsearch has the
# lines, so a restart, a crash or kill -9 loses none. ES_PASSWORD holds the
# fit user's password. Run it from the repository's root:
#   ES_PASSWORD=... fit run -c sync-files-to-elasticsearch/fit.conf
# 日志文件写入 Elasticsearch，就像 Filebeat 那样：跟踪 /var/log/app 中的 JSON
# 行，跨越轮转，写入按天的索引。检查点（每个文件的标识和偏移）只在
# Elasticsearch 拿到这些行之后才保存，所以重启、崩溃或 kill -9 都不会丢失。
# ES_PASSWORD 保存 fit 用户的密码。在仓库根目录运行：
#   ES_PASSWORD=... fit run -c sync-files-to-elasticsearch/fit.conf
sync {
	state_dir /tmp/fit-example-sync

	pipelines app-logs {
		# Globs are matched again every scan_interval, so new files are
		# found; a stack trace's lines join the line before them.
		# 每隔 scan_interval 重新匹配通配符，因此能发现新文件；堆栈跟踪的
		# 各行并入它前面的那一行。
		source file {
			paths /var/log/app/*.log
			codec json
			multiline { start "^\\{" }
		}
		# Drop debug lines before they leave fit.
		# 调试日志在离开 fit 之前就被丢弃。
		transforms filter {
			action drop
			where { field level; equals debug }
		}
		# Lines have no key: Elasticsearch makes their _ids, so the lines a
		# crash replays are indexed twice. A key of a field unique to each
		# line, as transforms key { fields request_id }, folds them.
		# 行没有键：由 Elasticsearch 生成 _id，所以崩溃后重放的行会被索引
		# 两次。用每行唯一的字段作键，如 transforms key { fields request_id }，
		# 重放就会合并。
		sinks search {
			sink elasticsearch {
				urls https://es1:9200 https://es2:9200
				username fit
				password_env ES_PASSWORD
				# A line has no commit time, so {yyyy.MM.dd} is the day it
				# is written: a daily index.
				# 文件中的行没有提交时间，所以 {yyyy.MM.dd} 是写入那天的
				# 日期：按天的索引。
				index app-logs-{yyyy.MM.dd}
			}
			batch { max_records 1000; max_bytes 5242880; max_wait 1s }
		}
		# A line Elasticsearch refuses (a mapping error) is kept as a dead
		# letter, listed and replayed with fit sync dead-letters.
		# Elasticsearch 拒绝的行（如映射错误）作为死信保存，可用
		# fit sync dead-letters 列出和重放。
		on_error dead_letter
		dead_letter { name refused; sink dead_letters }
		# A busy cluster's 429s hold the pipeline, and its queue the files.
		# 集群繁忙返回的 429 会让流水线等待，其队列再让文件读取等待。
		queue { max_records 20000; max_bytes 67108864 }
	}
}

# The Admin API, for fit sync status and the workbench's Sync pages.
# Admin API，供 fit sync status 和工作台的 Sync 页面使用。
admin { address 127.0.0.1:2019 }
