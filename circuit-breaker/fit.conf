# A circuit breaker: when half the requests of the last 10 seconds fail, or
# take over 2s, the route stops sending to the upstream for 30s and answers
# 503 at once, then lets 5 requests through to see whether it is back.
# Run it from the repository's root: fit run -c circuit-breaker/fit.conf
# 熔断器：当最近 10 秒内一半的请求失败或耗时超过 2s 时，该路由在 30s 内停止向
# 上游发送并立即返回 503，之后放行 5 个请求来判断上游是否已恢复。
# 在仓库根目录运行：fit run -c circuit-breaker/fit.conf
listener web :8080 http/1.1 h2c

upstream payments 127.0.0.1:9000

route payments {
	match { path /payments/* }
	middleware circuit_breaker {
		window 10s
		# Too few requests to judge by: stay closed.
		# 请求太少，不足以判断：保持闭合。
		min_requests 20
		error_ratio 0.5
		statuses 500 502 503 504
		slow_threshold 2s
		slow_ratio 0.5
		open_duration 30s
		half_open_requests 5
	}
	handler proxy { upstream payments }
}
