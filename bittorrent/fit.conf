# fit's BitTorrent client and tracker: the client downloads and seeds on
# port 6881 (TCP and UDP), publishes bittorrent/releases as hybrid torrents
# with fit's own static route as their web seed, and plays a torrent's file
# at /bt/<info hash>/ while it downloads. The tracker is private: HTTP
# announces at /tracker/<passkey>/announce, UDP ones on port 6969.
# Run it from the repository's root: fit run -c bittorrent/fit.conf
# Then try:
#   curl http://127.0.0.1:8080/torrents/
#   fit bt add -c bittorrent/fit.conf -category films 'magnet:?xt=urn:btih:...'
#   fit bt ls -c bittorrent/fit.conf
#   curl -H 'Authorization: Bearer player-token-replace-me' -o film.mkv \
#     http://127.0.0.1:8080/bt/<info hash>/
#   curl 'http://127.0.0.1:2019/bittorrent/tracker/passkey?user=alice'
# and give a client such as qBittorrent the tracker URL with alice's passkey:
# http://127.0.0.1:8080/tracker/<passkey>/announce
# fit 的 BitTorrent 客户端和 tracker：客户端在 6881 端口（TCP 和 UDP）下载和做种，
# 把 bittorrent/releases 发布为混合种子，以 fit 自己的 static 路由作为 web seed，
# 并在下载过程中通过 /bt/<info hash>/ 播放种子里的文件。tracker 是私有的：
# HTTP announce 在 /tracker/<passkey>/announce，UDP 的在 6969 端口。
# 在仓库根目录运行：fit run -c bittorrent/fit.conf
# 然后试一下：
#   curl http://127.0.0.1:8080/torrents/
#   fit bt add -c bittorrent/fit.conf -category films 'magnet:?xt=urn:btih:...'
#   fit bt ls -c bittorrent/fit.conf
#   curl -H 'Authorization: Bearer player-token-replace-me' -o film.mkv \
#     http://127.0.0.1:8080/bt/<info hash>/
#   curl 'http://127.0.0.1:2019/bittorrent/tracker/passkey?user=alice'
# 再把带 alice 的 passkey 的 tracker 地址交给 qBittorrent 等客户端：
# http://127.0.0.1:8080/tracker/<passkey>/announce
listener web :8080 http/1.1 h2c

# fit bt finds the running fit through its Admin API, on the loopback.
# fit bt 通过本机回环上的 Admin API 找到运行中的 fit。
admin { address 127.0.0.1:2019 }

# What the films category downloads appears in this library once complete.
# films 分类下载完成的内容会出现在这个媒体库中。
media_library films { roots bittorrent/downloads/films }

# The private tracker's passkeys: a static token, or a user's passkey, which
# the Admin API derives from the secret and the user's name. Replace the
# secret and the token with long random ones of your own.
# 私有 tracker 的 passkey：静态 token，或用户的 passkey（由 Admin API 根据
# secret 和用户名派生）。请把 secret 和 token 换成你自己的足够长的随机值。
media_auth members {
	secret replace-me-with-a-long-random-secret
	tokens seeder { token seeder-passkey-replace-me; play bittorrent/* }
	users alice { password alice-password; play bittorrent/* }
}

# Who may play a torrent's file at /bt/, and add one there by magnet link.
# 谁可以在 /bt/ 播放种子里的文件，以及通过 magnet 链接在那里添加种子。
media_auth viewers {
	tokens player { token player-token-replace-me; play bt/*; publish bt/* }
}

bittorrent {
	client {
		listen :6881
		# The client's state: its torrents, .torrent files and resume data.
		# 客户端的状态：种子列表、.torrent 文件和续传数据。
		data_dir bittorrent/data
		download_dir bittorrent/downloads
		# .torrent and .magnet files dropped here are added; those in
		# watch/films in the films category.
		# 放到这里的 .torrent 和 .magnet 文件会被添加；watch/films 中的
		# 归入 films 分类。
		watch_dir bittorrent/watch
		# MSE first, plaintext when a peer refuses; require refuses plaintext.
		# 优先使用 MSE 加密，对方拒绝时用明文；require 则拒绝明文。
		encryption prefer
		limits {
			# Bytes a second, all torrents together: 1 MiB up, 8 MiB down.
			# 每秒字节数，所有种子合计：上传 1 MiB，下载 8 MiB。
			upload_rate 1048576
			download_rate 8388608
			# Pause a torrent once it has uploaded twice its size.
			# 种子上传量达到自身大小的两倍后暂停。
			seed_ratio 2
			# Past these, torrents queue.
			# 超过这些数量的种子会排队。
			max_active_downloads 3
			max_active_seeds 5
			# Downloads leave this much of the disk free.
			# 下载会在磁盘上留出这么多空闲空间。
			min_free_bytes 10GiB
		}
		# Into downloads/films, and scanned into the films library.
		# 下载到 downloads/films，并扫描进 films 媒体库。
		categories { name films; dir films; media_library films; limits { seed_ratio 1 } }
		categories { name iso; dir iso; limits { upload_rate 4194304 } }
		# Slower rates on weekdays' working hours.
		# 工作日的工作时间使用较低的速率。
		alt_speed {
			upload_rate 131072
			download_rate 524288
			schedules { days weekdays; from 08:00; to 18:00 }
		}
		# Each file of bittorrent/releases as a hybrid torrent, seeded in
		# place, with its URL on fit's static route as its web seed and fit's
		# own tracker, through the seeder's passkey.
		# bittorrent/releases 中的每个文件发布为一个混合种子，原地做种，以它在
		# fit 的 static 路由上的地址作为 web seed，并通过 seeder 的 passkey
		# 使用 fit 自己的 tracker。
		publish {
			name releases
			dir bittorrent/releases
			web_seed http://127.0.0.1:8080/releases/
			announce http://127.0.0.1:8080/tracker/seeder-passkey-replace-me/announce
		}
	}
	tracker {
		listen :6969
		# Private: every announce needs a passkey of members whose grant plays
		# bittorrent/<info hash>.
		# 私有：每个 announce 都需要 members 的 passkey，且其授权可以播放
		# bittorrent/<info hash>。
		auth members
	}
}

route tracker { match { path /tracker/* }; handler bt_tracker }

# /torrents/ is the index in JSON, /torrents/<id>.torrent and
# /torrents/<id>.magnet each torrent.
# /torrents/ 是 JSON 索引，/torrents/<id>.torrent 和 /torrents/<id>.magnet
# 是各个种子。
route torrents { match { path /torrents/* }; handler bt_publish { publish releases } }

# The published files, the torrents' web seed.
# 发布的文件，即种子的 web seed。
route releases {
	match { path /releases/* }
	handler static { root bittorrent/releases; strip_prefix /releases }
}

route stream {
	match { path /bt/* }
	handler bt_stream { auth viewers; magnet true }
}
