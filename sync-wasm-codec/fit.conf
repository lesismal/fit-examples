# A WebAssembly codec of your own, for a line format of your own:
# prices.txt read through it into rows, and written back through it to a
# file of the same format, as well as to standard output. A line not in the
# format becomes a message record holding the line and the error, which the
# file sink cannot write, so it goes to dead letters. Nothing but fit is
# needed. Build the plugin, then run the pipeline once, from the
# repository's root:
#   GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o sync-wasm-codec/prices.wasm ./sync-wasm-codec/plugin
#   fit sync run -c sync-wasm-codec/fit.conf --once prices
# 自己编写的 WebAssembly 编解码器，用于自己的行格式：prices.txt 经它读成
# 行数据，再经它写回同样格式的文件，同时写到标准输出。不符合格式的行成为
# 带有该行和错误的消息记录，文件目标无法写出它，于是进入死信。除 fit 外
# 不需要别的。先构建插件，再在仓库根目录把流水线运行一次：
#   GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o sync-wasm-codec/prices.wasm ./sync-wasm-codec/plugin
#   fit sync run -c sync-wasm-codec/fit.conf --once prices
sync {
	# Each pipeline's checkpoint is kept here, as <name>.json.
	# 每条流水线的检查点保存在这里，文件名为 <name>.json。
	state_dir /tmp/fit-example-sync

	pipelines prices {
		# Each line through the plugin's fit_sync_decode.
		# 每一行都经过插件的 fit_sync_decode。
		source file {
			paths sync-wasm-codec/prices.txt
			codec wasm {
				path sync-wasm-codec/prices.wasm
				timeout 500ms
			}
		}
		sinks out { sink stdout }
		# Each record through the plugin's fit_sync_encode, a line of the
		# file.
		# 每条记录经过插件的 fit_sync_encode，成为文件中的一行。
		sinks copy {
			sink file {
				path /tmp/fit-example-sync/prices-copy.txt
				codec wasm { path sync-wasm-codec/prices.wasm }
			}
		}
		on_error dead_letter
		dead_letter { name errors; sink dead_letters }
	}
}
