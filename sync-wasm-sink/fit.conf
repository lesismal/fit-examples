# A sync sink of your own, a WebAssembly plugin: events.ndjson, tailed,
# posted in batches to a webhook as NDJSON through fit's HTTP client. fit
# answers the webhook too, on 127.0.0.1:8092, so nothing but fit is needed.
# Build the plugin, then run fit from the repository's root:
#   GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o sync-wasm-sink/webhook.wasm ./sync-wasm-sink/plugin
#   fit run -c sync-wasm-sink/fit.conf
# The plugin logs each post; append a line to events.ndjson and it is
# posted. Point url at a webhook of your own, and allow_hosts at its host.
# 自己编写的同步目标，一个 WebAssembly 插件：持续读取 events.ndjson，通过
# fit 的 HTTP 客户端把记录按批次以 NDJSON 格式发送到 webhook。webhook 也由
# fit 在 127.0.0.1:8092 上应答，所以除 fit 外不需要别的。先构建插件，再在
# 仓库根目录运行 fit：
#   GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o sync-wasm-sink/webhook.wasm ./sync-wasm-sink/plugin
#   fit run -c sync-wasm-sink/fit.conf
# 插件会记录每次发送；往 events.ndjson 追加一行，它就会被发送。把 url
# 指向你自己的 webhook，并把 allow_hosts 改为它的主机。
listener hooks 127.0.0.1:8092 http/1.1

# The webhook, which takes every post.
# webhook，接受每一次发送。
route ingest {
	match { path /ingest; method POST }
	handler respond { status 202; body "accepted\n" }
}

sync {
	# Each pipeline's checkpoint is kept here, as <name>.json.
	# 每条流水线的检查点保存在这里，文件名为 <name>.json。
	state_dir /tmp/fit-example-sync

	pipelines events {
		source file {
			paths sync-wasm-sink/events.ndjson
			codec json
		}
		# The plugin's requests may go to the hosts allow_hosts names, and
		# nowhere else: no sockets of its own. A post that fails is tried
		# again as retry says.
		# 插件的请求只能发往 allow_hosts 列出的主机，别无他处：它没有自己
		# 的套接字。失败的发送按 retry 的设置重试。
		sinks webhook {
			sink wasm {
				path sync-wasm-sink/webhook.wasm
				config "{\"url\": \"http://127.0.0.1:8092/ingest\", \"token\": \"example-token\"}"
				allow_hosts 127.0.0.1:8092
				timeout 10s
			}
			batch { max_records 100; max_wait 1s }
		}
	}
}
