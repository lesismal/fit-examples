# Limits and engine tuning for a busy edge: every listener's bounds on
# connections, header and body sizes and the bytes waiting for slow clients,
# and fib's event loops, workers and buffers. Left out, each has a safe default.
# Run it from the repository's root: fit run -c limits/fit.conf
# 繁忙边缘节点的限制与引擎调优：每个监听器在连接数、header 和 body 大小、
# 等待慢客户端的字节数上的上限，以及 fib 的事件循环、worker 和缓冲区。
# 省略时，每项都有安全的默认值。
# 在仓库根目录运行：fit run -c limits/fit.conf
listener web :8080 http/1.1 h2c

route hello { handler respond { body "hello\n" } }

limits {
	# Bytes waiting for slow clients, in all: a share of memory, or bytes.
	# 等待慢客户端的字节总量：内存的一个比例，或字节数。
	max_pending_bytes 25%
	max_header_bytes 64KiB
	max_conns 200000
	max_body_bytes 32MiB
	# Bytes waiting to be written to one connection.
	# 等待写入单个连接的字节数。
	max_write_queue_bytes 8MiB
	# A client that takes nothing for this long is closed.
	# 这么久都不接收任何数据的客户端会被关闭。
	write_stall_timeout 30s
}

engine {
	# 0 for fib's own choice, from the CPUs.
	# 0 表示由 fib 根据 CPU 自行决定。
	event_loops 8
	workers 64
	min_workers 8
	task_queue 65536
	read_buffer_size 64KiB
	# A connection stops reading past this many bytes unwritten.
	# 未写出的字节超过这个数时，连接停止读取。
	write_watermark 262144
	backlog 4096
}
