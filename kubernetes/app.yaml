# The app fit sends to: two replicas of whoami, which answers with its
# pod's name, behind a Service.
# fit 发往的应用：位于一个 Service 之后的两个 whoami 副本，whoami 会应答
# 自己 pod 的名字。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 2
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /health, port: 80}
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
spec:
  selector: {app: whoami}
  ports:
    - name: http
      port: 80
