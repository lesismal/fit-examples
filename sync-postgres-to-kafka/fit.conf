# PostgreSQL's changes to Kafka, as Debezium sends them: a snapshot of the
# tables, then every insert, update and delete through logical replication,
# each table to a topic of its own in Debezium's format. The slot is told
# an LSN only once Kafka has the changes up to it, so a restart, a crash or
# kill -9 loses none. The server needs wal_level = logical and a user with
# REPLICATION and SELECT on the tables; PG_PASSWORD and KAFKA_PASSWORD hold
# the passwords. Run it from the repository's root:
#   PG_PASSWORD=... KAFKA_PASSWORD=... fit run -c sync-postgres-to-kafka/fit.conf
# PostgreSQL 的变更写入 Kafka，就像 Debezium 那样：先读表的快照，再经逻辑复制
# 读每个 insert、update 和 delete，每张表写到自己的主题，采用 Debezium 格式。
# 只有当 Kafka 拿到某个 LSN 之前的变更后，才把该 LSN 告诉复制槽，所以重启、
# 崩溃或 kill -9 都不会丢失。服务器需要 wal_level = logical，用户需有
# REPLICATION 属性和表的 SELECT 权限；PG_PASSWORD 和 KAFKA_PASSWORD 保存密码。
# 在仓库根目录运行：
#   PG_PASSWORD=... KAFKA_PASSWORD=... fit run -c sync-postgres-to-kafka/fit.conf
sync {
	state_dir /tmp/fit-example-sync

	pipelines shop-cdc {
		source postgres {
			address db.internal:5432
			user repl
			password_env PG_PASSWORD
			database shop
			# TLS is verify-full by default, against the system's roots
			# or ca_file's.
			# TLS 默认为 verify-full，按系统根证书或 ca_file 中的证书校验。
			sslmode verify-full
			# Made when missing: the publication for these tables, and
			# the slot. Drop the slot when the pipeline goes for good.
			# 缺失时创建：这些表的 publication，以及复制槽。流水线永久
			# 移除时请删除复制槽。
			create true
			publication fit_shop
			slot fit_shop
			tables public.orders public.order_items
			# The rows there are first, then the changes after them.
			# 先读已有的行，再读其后的变更。
			snapshot initial
			# Warn when the slot keeps more WAL than this behind it.
			# 复制槽在其后保留的 WAL 超过此值时发出警告。
			lag_warning 1073741824
		}
		sinks kafka {
			sink kafka {
				brokers kafka-1:9093 kafka-2:9093
				tls true
				sasl SCRAM-SHA-512
				username fit
				password_env KAFKA_PASSWORD
				# public.orders goes to cdc.public.orders, keyed by its
				# primary key, so a row's changes stay in order.
				# public.orders 写到 cdc.public.orders，以主键为消息键，
				# 所以同一行的变更保持顺序。
				topic cdc.{namespace}
				codec debezium
				compression zstd
				create_topics { partitions 6; replication_factor 3 }
			}
			batch { max_records 2000; max_wait 200ms }
		}
	}
}

admin { address 127.0.0.1:2019 }
