# Path rewrites before the upstream sees the request: a prefix taken off, a
# prefix put on, and a regular expression's matches replaced.
# Run it from the repository's root: fit run -c rewrite/fit.conf
# 在上游看到请求之前改写路径：去掉一个前缀、加上一个前缀，以及替换正则表达式
# 的匹配。
# 在仓库根目录运行：fit run -c rewrite/fit.conf
listener web :8080 http/1.1 h2c

upstream users 127.0.0.1:9001
upstream legacy 127.0.0.1:9002

# /api/users/7 reaches the users service as /v2/users/7.
# /api/users/7 以 /v2/users/7 到达 users 服务。
route users {
	match { path /api/users/* }
	middleware rewrite { strip_prefix /api; add_prefix /v2 }
	handler proxy { upstream users }
}

# /shop/item/42 reaches the legacy app as /item.php/42.
# /shop/item/42 以 /item.php/42 到达 legacy 应用。
route legacy {
	match { path /shop/* }
	middleware rewrite {
		regexp ^/shop/item/([0-9]+)$
		replacement /item.php/$1
	}
	handler proxy { upstream legacy }
}
