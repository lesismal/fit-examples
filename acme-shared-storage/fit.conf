# ACME certificates shared by several fit instances through Redis: one
# instance obtains each certificate, holding a lock there, the others take it
# from there, and whichever instance the CA reaches answers its challenge.
# shared_storage takes etcd or consul in place of redis the same way.
# Run it from the repository's root: fit run -c acme-shared-storage/fit.conf
# 多个 fit 实例通过 Redis 共享 ACME 证书：每张证书由一个实例在 Redis 中持有锁
# 来获取，其他实例从那里取用，CA 访问到哪个实例，就由哪个实例应答它的质询。
# shared_storage 也可以用同样的方式以 etcd 或 consul 代替 redis。
# 在仓库根目录运行：fit run -c acme-shared-storage/fit.conf
listener https :443 http/1.1 h2 { tls { acme example.com www.example.com } }
listener http :80 http/1.1

route site {
	listeners https
	handler respond { body "hello from one of several\n" }
}

route to-https {
	listeners http
	middleware redirect { to https://{host}{uri}; status 308 }
	handler respond { status 404 }
}

acme {
	email ops@example.com
	shared_storage {
		redis {
			address redis.internal:6379
			username fit
			# Read at each connection; not in this directory.
			# 每次连接时读取；不在本目录中。
			password_file /etc/fit/redis-password
			db 0
		}
		# Instances that share certificates share the prefix.
		# 共享证书的实例使用相同的前缀。
		prefix fit/
		lock_ttl 30s
		request_timeout 10s
	}
}
