# An LLM node: serves models of several kinds (a local Ollama, through its
# OpenAI-compatible API and its own, and hosted Anthropic, Gemini, Azure
# OpenAI and Cohere models, whose keys are placeholders to replace) to the
# hub it links to (llm-hub), and through it to proxies. Its console is on
# 127.0.0.1:9100, user admin, password example-password. The id is written
# out, as fit would otherwise write a new one back into this file.
# Run it from the repository's root: fit run -c llm-node/fit.conf
# 一个 LLM node：向它连接的 hub（llm-hub），并经由 hub 向 proxy，提供
# 多种模型（本地 Ollama，通过其 OpenAI 兼容 API 和其自有 API；以及托管的
# Anthropic、Gemini、Azure OpenAI 和 Cohere 模型，其密钥为待替换的占位符）。
# 其控制台在 127.0.0.1:9100，用户 admin，密码 example-password。id 已
# 写明，否则 fit 会生成一个新的 id 写回本文件。
# 在仓库根目录运行：fit run -c llm-node/fit.conf
llm {
	node {
		id node-0d9e4b7a61c2f835
		name gpu-1
		description "Two RTX 4090s"
		console {
			address 127.0.0.1:9100
			users {
				username admin
				password_hash $2a$10$gkDJyGagxp1q7R24F0rSjulsgZOFL55Zm6JK2RcxTCLDk23szhZA2
			}
		}
		# The node dials the hub; it needs no listen of its own.
		# node 主动连接 hub；它自己不需要 listen。
		peers { address 127.0.0.1:9210; password mesh-secret; role hub }
		# Asked for as qwen3-32b, sent upstream as qwen3:32b.
		# 以 qwen3-32b 请求，以 qwen3:32b 发往上游。
		models qwen3-32b {
			api openai
			base_url http://127.0.0.1:11434/v1
			upstream qwen3:32b
			max_inflight 4
		}
		# Ollama's own API (/api/chat, /api/generate, /api/embed).
		# Ollama 自有 API（/api/chat、/api/generate、/api/embed）。
		models llama3.2 { api ollama; base_url http://127.0.0.1:11434; upstream llama3.2:3b }
		models claude-sonnet {
			api anthropic
			base_url https://api.anthropic.com/v1
			upstream claude-sonnet-4-5
			api_key sk-ant-replace-me
		}
		# Agents call it at /v1beta/models/gemini-flash:generateContent.
		# agent 通过 /v1beta/models/gemini-flash:generateContent 调用它。
		models gemini-flash {
			api gemini
			base_url https://generativelanguage.googleapis.com/v1beta
			upstream gemini-2.5-flash
			api_key replace-me
		}
		# Agents call it as OpenAI; upstream is the Azure deployment.
		# agent 以 OpenAI 方式调用它；upstream 是 Azure 部署。
		models gpt-4o {
			api azure_openai
			base_url https://example.openai.azure.com
			upstream gpt-4o-prod
			api_version 2024-10-21
			api_key replace-me
		}
		models rerank { api cohere; base_url https://api.cohere.com/v2; upstream rerank-v3.5; api_key replace-me }
		settings { allow_hub_manage false; refresh_interval 30s }
		proxy { first_byte_timeout 5m; timeout 30m; max_inflight 64 }
	}
}
