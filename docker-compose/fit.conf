# The config of compose.yaml's fit container: routes come from the
# containers' labels, through the Docker provider; any other host gets 404.
# compose.yaml 中 fit 容器的配置：路由来自各容器的标签，经由 Docker provider；
# 其他任何主机返回 404。
listener web {
	address :8080
	protocols http/1.1 h2c
}

provider {
	docker {}
}

route not-found {
	priority -1
	handler respond {
		status 404
		body "no route for this host\n"
	}
}
