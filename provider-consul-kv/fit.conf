# Listeners, routes, upstreams and services from Consul's KV store: each key
# under fit/ holds a JSON object of them, as a config does, e.g.
#   consul kv put fit/app '{"routes": [{"handler": {"module": "respond"}}]}'
# Run it from the repository's root: fit run -c provider-consul-kv/fit.conf
listener web :8080 http/1.1 h2c

provider consul-kv {
	consul_kv { endpoint http://127.0.0.1:8500; prefix fit/; max_keys 1000 }
}
