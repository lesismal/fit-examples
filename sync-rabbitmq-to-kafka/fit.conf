# RabbitMQ's queues into Kafka, and back: the orders queue's messages
# copied to the Kafka topic orders as they are, each acknowledged to
# RabbitMQ only once Kafka has it, so a crash or kill -9 loses none (an
# unacknowledged message is redelivered); and Kafka's shipments topic
# published to RabbitMQ's exchange events, confirmed before Kafka's offset
# moves past it. RABBITMQ_PASSWORD and KAFKA_PASSWORD hold the passwords.
# Run it from the repository's root:
#   RABBITMQ_PASSWORD=... KAFKA_PASSWORD=... fit run -c sync-rabbitmq-to-kafka/fit.conf
# RabbitMQ 的队列写入 Kafka，并反向写回：orders 队列的消息原样复制到 Kafka
# 的 orders 主题，每条消息只在 Kafka 拿到后才向 RabbitMQ 确认，所以崩溃或
# kill -9 都不会丢失（未确认的消息会重新投递）；Kafka 的 shipments 主题发布
# 到 RabbitMQ 的 events 交换器，确认后 Kafka 的 offset 才越过它。
# RABBITMQ_PASSWORD 和 KAFKA_PASSWORD 保存密码。在仓库根目录运行：
#   RABBITMQ_PASSWORD=... KAFKA_PASSWORD=... fit run -c sync-rabbitmq-to-kafka/fit.conf
sync {
	state_dir /tmp/fit-example-sync

	pipelines orders-to-kafka {
		source rabbitmq {
			addresses rabbit-1:5671 rabbit-2:5671
			tls true
			username fit
			password_env RABBITMQ_PASSWORD
			# Quorum or classic queues; stream queues go in streams,
			# their offsets in the checkpoint.
			# quorum 或 classic 队列；stream 队列写在 streams 中，
			# 其 offset 保存在检查点里。
			queues orders
			# How many messages the broker sends before they are
			# acknowledged: the pipeline's read-ahead.
			# broker 在确认之前最多发送多少条消息：流水线的预读量。
			prefetch 1000
			codec raw
		}
		sinks kafka {
			sink kafka {
				brokers kafka-1:9093 kafka-2:9093
				tls true
				sasl SCRAM-SHA-512
				username fit
				password_env KAFKA_PASSWORD
				topic orders
				codec raw
			}
			batch { max_records 1000; max_wait 100ms }
		}
	}

	pipelines shipments-to-rabbitmq {
		source kafka {
			brokers kafka-1:9093 kafka-2:9093
			tls true
			sasl SCRAM-SHA-512
			username fit
			password_env KAFKA_PASSWORD
			topics shipments
			codec raw
		}
		sinks rabbitmq {
			sink rabbitmq {
				addresses rabbit-1:5671 rabbit-2:5671
				tls true
				username fit
				password_env RABBITMQ_PASSWORD
				# Persistent messages, a batch confirmed by the broker
				# before it counts as written.
				# 持久化消息，一个批次经 broker 确认后才算写入。
				exchange events
				routing_key shipments.{namespace}
				codec raw
			}
		}
	}
}

admin { address 127.0.0.1:2019 }
