# Load balancing: weighted least-connections over three backends, sticky
# sessions by cookie, active health checks with passive ones beside them,
# retries within a budget, a 5% canary, a failover pool and mirrored traffic.
# Run it from the repository's root: fit run -c load-balancing/fit.conf
# 负载均衡：在三个后端上做加权最少连接，按 cookie 的会话保持，主动健康
# 检查并辅以被动检查，预算内的重试，5% 的金丝雀，故障转移池以及流量镜像。
# 在仓库根目录运行：fit run -c load-balancing/fit.conf
listener web :8080 http/1.1 h2c

upstream app 10.0.0.11:8080 10.0.0.12:8080 10.0.0.13:8080 {
	# The third backend is a smaller machine: it takes half as much.
	# 第三个后端是较小的机器：它只承担一半的量。
	weights 2 2 1
	load_balancing least_conn
	# A client keeps going to the backend it was first sent to.
	# 客户端会一直发往它第一次被分到的后端。
	sticky_cookie { name fit_backend; max_age 1h; secure true }
	max_conns 512
	connect_timeout 3s
	# Passive checks: a backend failing 3 times in 30s leaves rotation for 30s.
	# 被动检查：30s 内失败 3 次的后端退出轮转 30s。
	max_fails 3
	fail_timeout 30s
	# Active checks: out after 2 failures, back after 2 passes.
	# 主动检查：失败 2 次即移出，通过 2 次即恢复。
	health_check {
		path /healthz
		expect_status 200 204
		interval 5s
		timeout 2s
		fails 2
		passes 2
	}
}

upstream app-canary 10.0.1.11:8080 { health_check { path /healthz } }

# Takes the requests while no backend of app is in rotation.
# app 没有任何后端在轮转中时，由它接收请求。
upstream app-backup 10.0.2.11:8080 { health_check { type tcp; interval 10s } }

# Gets a copy of the requests; its answers are thrown away.
# 收到请求的副本；它的响应会被丢弃。
upstream shadow 10.0.3.11:8080

route app {
	handler proxy {
		# 95 of 100 requests to app, 5 to the canary.
		# 100 个请求中 95 个发往 app，5 个发往 canary。
		upstreams { upstream app; weight 95 }
		upstreams { upstream app-canary; weight 5 }
		failover app-backup
		mirror { upstream shadow; percent 10 }
		# Retry idempotent requests on another backend, but never more than
		# a fifth of the traffic, so retries cannot pile onto an outage.
		# 幂等请求在另一个后端上重试，但重试从不超过流量的五分之一，
		# 以免重试在故障期间不断叠加。
		retry {
			attempts 2
			statuses 502 503 504
			budget_ratio 0.2
			budget_min_per_second 10
		}
		timeout 30s
	}
}
