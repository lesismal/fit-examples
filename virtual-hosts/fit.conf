# Several sites on one listener, told apart by host name: exact names, a
# "*." wildcard, and a default for any other host. In fit.conf, each site's
# routes are written together in a site block.
# Run it from the repository's root: fit run -c virtual-hosts/fit.conf
# Try it: curl -H 'Host: blog.example.com' http://127.0.0.1:8080/
# 一个监听器上的多个站点，按主机名区分：精确名称、"*." 通配符，以及用于其他
# 任何主机的默认站点。在 fit.conf 中，每个站点的路由写在一个 site 块中。
# 在仓库根目录运行：fit run -c virtual-hosts/fit.conf
# 试一下：curl -H 'Host: blog.example.com' http://127.0.0.1:8080/
listener web :8080 http/1.1 h2c

site example.com www.example.com {
	route {
		name www
		handler respond { body "www\n" }
	}
}

site api.example.com {
	route /v1/* {
		name api
		handler respond { body "api v1\n" }
	}
}

# One label below example.com: blog.example.com, shop.example.com.
# example.com 之下的一级标签：blog.example.com、shop.example.com。
site *.example.com {
	route {
		name tenants
		handler respond { body "a tenant's site\n" }
	}
}

# Any other host.
# 其他任何主机。
site * {
	route {
		name default
		priority -1
		handler respond { status 421; body "unknown host\n" }
	}
}
