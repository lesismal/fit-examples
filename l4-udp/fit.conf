# Layer 4 UDP proxying: DNS datagrams spread over two resolvers, each client
# address a session of its own that keeps to one resolver.
# Run it from the repository's root: fit run -c l4-udp/fit.conf
# Try it: dig @127.0.0.1 -p 5353 example.com
# 四层 UDP 代理：DNS 数据报分散到两个解析器，每个客户端地址是一个独立的
# 会话，固定使用一个解析器。
# 在仓库根目录运行：fit run -c l4-udp/fit.conf
# 试一下：dig @127.0.0.1 -p 5353 example.com
listener dns :5353 udp

# A client keeps to one resolver.
# 一个客户端固定使用一个解析器。
upstream resolvers 10.0.0.53:53 10.0.1.53:53 { load_balancing ip_hash }

service dns {
	listeners dns
	upstream resolvers
	# A session with nothing either way for this long ends.
	# 两个方向都没有数据达到这么久的会话即结束。
	idle_timeout 30s
	max_conns 10000
}
