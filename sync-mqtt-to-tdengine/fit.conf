# Meters' readings from MQTT into TDengine: JSON messages written through
# taosAdapter's REST interface as rows of the super table meters, a
# subtable for each meter named d_<meter>, its tags the meter's location
# and group, made at its first row; a row is its subtable and its time,
# so a replay writes the same rows. The database power and the super
# table are yours (precision ms). MQTT_PASSWORD and TD_PASSWORD hold the
# passwords. Run it from the repository's root:
#   MQTT_PASSWORD=... TD_PASSWORD=... fit run -c sync-mqtt-to-tdengine/fit.conf
# 电表读数从 MQTT 写入 TDengine：JSON 消息经 taosAdapter 的 REST 接口写成超级表
# meters 的行，每个电表一个名为 d_<meter> 的子表，标签为电表的位置和分组，在
# 第一行写入时创建；一行由其子表和时间确定，所以重放写入的是相同的行。数据库
# power 和超级表由你创建（精度 ms）。MQTT_PASSWORD 和 TD_PASSWORD 保存密码。
# 在仓库根目录运行：
#   MQTT_PASSWORD=... TD_PASSWORD=... fit run -c sync-mqtt-to-tdengine/fit.conf
sync {
	state_dir /tmp/fit-example-sync

	pipelines meters {
		source mqtt {
			servers mqtt.internal:8883
			tls true
			client_id fit-meters
			username fit
			password_env MQTT_PASSWORD
			topics meters/#
			codec json
		}
		sinks tdengine {
			sink tdengine {
				url http://tdengine.internal:6041
				username root
				password_env TD_PASSWORD
				database power
				# INSERT ... USING meters TAGS (...): the super table's
				# columns are ts, current, voltage, phase.
				# INSERT ... USING meters TAGS (...)：超级表的列为 ts、
				# current、voltage、phase。
				mode sql
				measurement meters
				subtable d_{meter}
				tags location group_id
				fields current voltage phase
				time_field at
				precision ms
			}
			batch { max_records 2000; max_wait 1s }
		}
	}
}

admin { address 127.0.0.1:2019 }
