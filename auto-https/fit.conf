# HTTPS by default: no listeners written, so fit serves the routes' host
# names on 443 with certificates from Let's Encrypt, obtained and renewed by
# itself, and redirects port 80 to HTTPS. The names must resolve to this host,
# and ports 80 and 443 reach it, for the CA's challenges.
# Run it from the repository's root: fit run -c auto-https/fit.conf
# 默认 HTTPS：没有写任何监听器，因此 fit 在 443 端口为各路由的主机名提供服务，
# 使用自己从 Let's Encrypt 获取并续期的证书，并把 80 端口重定向到 HTTPS。
# 为了 CA 的质询，这些名称必须解析到本主机，且 80 和 443 端口能访问到它。
# 在仓库根目录运行：fit run -c auto-https/fit.conf
route site {
	match { host example.com www.example.com }
	handler respond { body "hello over HTTPS\n" }
}

route api { match { host api.example.com }; handler respond { body "api\n" } }

acme {
	# Where the CA writes about expiring certificates.
	# CA 发送证书即将过期通知的地址。
	email ops@example.com
	# Let's Encrypt's staging CA, while trying it out; leave directory out
	# for the real one.
	# Let's Encrypt 的 staging CA，用于试用阶段；使用正式 CA 时省略 directory。
	directory https://acme-staging-v02.api.letsencrypt.org/directory
	# Accounts, keys and certificates.
	# 账户、密钥和证书。
	storage /var/lib/fit/acme
}
