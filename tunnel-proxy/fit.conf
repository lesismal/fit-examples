# A tunnel proxy: local ports forwarded through the hub
# (tunnel-hub) to the services of a node (tunnel-node).
# Then ssh -p 2222 127.0.0.1 reaches the lab's 10.0.0.5:22.
# Run it from the repository's root: fit run -c tunnel-proxy/fit.conf
# 一个隧道 proxy：本地端口经 hub（tunnel-hub）转发到某个 node（tunnel-node）
# 的服务。
# 然后 ssh -p 2222 127.0.0.1 即可到达 lab 的 10.0.0.5:22。
# 在仓库根目录运行：fit run -c tunnel-proxy/fit.conf
tunnel {
	proxy {
		name alice
		hubs hub {
			endpoints { address 127.0.0.1:7000 }
			password a-registration-password
			body_password a-body-password
		}
		forwards { listen 127.0.0.1:2222; node lab; service ssh }
		forwards { listen 127.0.0.1:8888; node lab; service web }
		open_timeout 20s
		max_tunnels 1024
	}
}
