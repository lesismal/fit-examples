# Log files to Grafana Loki and to an OpenTelemetry Collector, as Promtail
# and the Collector's filelog receiver do: the files tailed across
# rotations, each JSON line pushed to Loki in a stream labelled by the
# app and the line's level (labels from those fields only, so the streams
# stay few), and exported as OTLP log records with the line's level as
# their severity. A line is sent again only after a crash, at the times it
# was read. Run it from the repository's root:
#   fit run -c sync-files-to-loki/fit.conf
# 日志文件写入 Grafana Loki 和 OpenTelemetry Collector，就像 Promtail 和
# Collector 的 filelog 接收器那样：跨轮转跟踪文件，每行 JSON 推送到 Loki 中以
# 应用和该行的级别为标签的流（标签只取这两个字段，所以流的数量不多），并导出
# 为 OTLP 日志记录，以该行的级别作为其严重程度。只有崩溃后才会再次发送某行，
# 时间为读到它的时间。在仓库根目录运行：
#   fit run -c sync-files-to-loki/fit.conf
sync {
	state_dir /tmp/fit-example-sync

	pipelines app-logs {
		source file {
			paths /var/log/app/*.log
			codec json
		}
		sinks loki {
			sink loki {
				urls http://loki.internal:3100
				labels { app shop; level "{level}" }
			}
			batch { max_wait 1s }
		}
		sinks otlp {
			sink otlp_logs {
				urls http://otel-collector.internal:4318
				service_name shop
				body row
				severity_field level
			}
			batch { max_wait 1s }
		}
	}
}

admin { address 127.0.0.1:2019 }
