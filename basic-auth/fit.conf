# HTTP Basic authentication in front of a route: users with bcrypt hashes of
# their passwords, made with: fit hash-password < password.txt
# The user here is alice, password example-password.
# Run it from the repository's root: fit run -c basic-auth/fit.conf
# Try it: curl -u alice:example-password http://127.0.0.1:8080/private/
# 在路由前加 HTTP Basic 认证：用户及其密码的 bcrypt 哈希，哈希由以下命令生成：
# fit hash-password < password.txt
# 这里的用户是 alice，密码是 example-password。
# 在仓库根目录运行：fit run -c basic-auth/fit.conf
# 试一下：curl -u alice:example-password http://127.0.0.1:8080/private/
listener web :8080 http/1.1 h2c

route private {
	match { path /private/* }
	middleware basic_auth {
		# What the browser's login box shows.
		# 浏览器登录框中显示的内容。
		realm staff
		users {
			username alice
			password_hash $2a$10$gkDJyGagxp1q7R24F0rSjulsgZOFL55Zm6JK2RcxTCLDk23szhZA2
		}
		# Tell the handler, and an upstream behind it, who logged in.
		# 告诉处理器及其后面的上游是谁登录了。
		user_header X-User
	}
	handler respond { body "hello, you are logged in\n" }
}
