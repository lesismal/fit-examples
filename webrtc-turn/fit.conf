# A TURN server (RFC 8656) for WebRTC peers that cannot reach each other
# directly: UDP and TCP on 3478, fixed users, and time-limited credentials
# that a web service makes from the shared secret, as coturn's
# use-auth-secret. The relayed sockets take ports 49152-49999.
# Run it from the repository's root: fit run -c webrtc-turn/fit.conf
# 一个 TURN 服务器（RFC 8656），供无法直接互通的 WebRTC peer 使用：UDP 和
# TCP 都在 3478，固定用户，以及 Web 服务用共享密钥生成的限时凭据，如同 coturn
# 的 use-auth-secret。中继 socket 使用端口 49152-49999。
# 在仓库根目录运行：fit run -c webrtc-turn/fit.conf
webrtc {
	turn {
		listen :3478
		listen_tcp :3478
		realm example.com
		users alice { password a-password }
		# Credentials "<expiry>:<anything>" / base64(HMAC-SHA1(secret, username)).
		# 凭据 "<expiry>:<anything>" / base64(HMAC-SHA1(secret, username))。
		secret a-secret-shared-with-the-web-service
		# The host's address the relayed sockets bind to; behind a 1:1 NAT,
		# clients are told public_ip instead.
		# 中继 socket 绑定的主机地址；在 1:1 NAT 之后，告知客户端的是
		# public_ip。
		relay_ip 10.0.0.5
		public_ip 203.0.113.5
		port_min 49152
		port_max 49999
		max_allocations 1024
		max_allocations_per_user 16
		# Bytes a second per user each way.
		# 每个用户每个方向每秒的字节数。
		user_bandwidth 2097152
	}
}
