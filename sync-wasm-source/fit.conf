# A sync source of your own, a WebAssembly plugin: it reads a paged HTTP
# API through fit's HTTP client, from where its checkpoint says, into
# standard output. fit serves the API too, the pages in
# sync-wasm-source/api, so nothing but fit is needed. Build the plugin,
# then run fit from the repository's root:
#   GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o sync-wasm-source/pages.wasm ./sync-wasm-source/plugin
#   fit run -c sync-wasm-source/fit.conf
# Add an item to api/page-2.json, or a page-3.json with page-2.json's
# "next" naming it, and the next poll reads it; restarted, fit goes on from
# the checkpoint.
# 自己编写的同步源，一个 WebAssembly 插件：它通过 fit 的 HTTP 客户端，从
# 检查点所在的位置读取分页的 HTTP API，写到标准输出。API 也由 fit 提供，
# 即 sync-wasm-source/api 中的页面，所以除 fit 外不需要别的。先构建插件，
# 再在仓库根目录运行 fit：
#   GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o sync-wasm-source/pages.wasm ./sync-wasm-source/plugin
#   fit run -c sync-wasm-source/fit.conf
# 往 api/page-2.json 加一项，或者加一个 page-3.json 并让 page-2.json 的
# "next" 指向它，下一次轮询就会读到；重启后 fit 从检查点继续。
listener api 127.0.0.1:8091 http/1.1

# The API: GET /api/page-1.json and so on.
# API：GET /api/page-1.json 等。
route api {
	match { path /api/* }
	handler static {
		root sync-wasm-source
		# Read from the disk each time, so an edit shows at the next poll.
		# 每次都从磁盘读取，这样编辑在下一次轮询时就能看到。
		check_interval 0s
	}
}

sync {
	# Each pipeline's checkpoint is kept here, as <name>.json.
	# 每条流水线的检查点保存在这里，文件名为 <name>.json。
	state_dir /tmp/fit-example-sync

	pipelines tickets {
		# The plugin's requests may go to the hosts allow_hosts names, and
		# nowhere else: no sockets of its own.
		# 插件的请求只能发往 allow_hosts 列出的主机，别无他处：它没有自己
		# 的套接字。
		source wasm {
			path sync-wasm-source/pages.wasm
			config "{\"url\": \"http://127.0.0.1:8091/api/\", \"first\": \"page-1.json\"}"
			allow_hosts 127.0.0.1:8091
			# Once it has caught up, poll again after this.
			# 追上之后，隔这么久再轮询。
			poll_interval 5s
			timeout 10s
		}
		sinks out { sink stdout }
	}
}
