# An LLM proxy: it links to the hub (llm-hub), which may be
# across the internet, and serves the model APIs (OpenAI's /v1/chat/completions
# and the rest, Anthropic's /v1/messages, Gemini's /v1beta/models/..., Ollama's
# /api/chat, Cohere's /v2/chat) on 127.0.0.1:9301 to the agents of this
# machine, calling the models of the nodes the hub reaches. To serve agents on
# other machines of the LAN, listen on a LAN address with cert_file and key_file. API keys are made on its
# console, 127.0.0.1:9300, user admin, password example-password. The id is
# written out, as fit would otherwise write a new one back into this file.
# Run it from the repository's root: fit run -c llm-proxy/fit.conf
# 一个 LLM proxy：它连接到 hub（llm-hub，可能位于互联网另一端），在
# 127.0.0.1:9301 上为本机的 agent 提供模型 API（OpenAI 的
# /v1/chat/completions 等、Anthropic 的 /v1/messages、Gemini 的
# /v1beta/models/...、Ollama 的 /api/chat、Cohere 的 /v2/chat），调用 hub
# 能触达的 node 上的模型。要为局域网内其他机器的 agent 提供服务，请监听
# 局域网地址并配置 cert_file 和 key_file。API key 在其控制台上创建：
# 127.0.0.1:9300，用户 admin，密码 example-password。id 已写明，否则 fit
# 会生成一个新的 id 写回本文件。
# 在仓库根目录运行：fit run -c llm-proxy/fit.conf
llm {
	proxy {
		id proxy-7a3e91c04d5b2f68
		name laptop
		console {
			address 127.0.0.1:9300
			users {
				username admin
				password_hash $2a$10$gkDJyGagxp1q7R24F0rSjulsgZOFL55Zm6JK2RcxTCLDk23szhZA2
			}
		}
		peers { address 127.0.0.1:9210; password mesh-secret; role hub }
		api {
			# Off loopback, it needs cert_file and key_file.
			# 不在 loopback 上时，需要 cert_file 和 key_file。
			address 127.0.0.1:9301
			max_body_bytes 32MiB
			max_inflight 64
			first_byte_timeout 5m
			timeout 30m
		}
	}
}
