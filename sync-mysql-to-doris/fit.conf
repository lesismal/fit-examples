# MySQL's tables kept in Apache Doris (or StarRocks, with flavor
# starrocks): the binlog's inserts, updates and deletes written by Stream
# Load into tables of Doris's unique key model, deletes through its delete
# sign, each load labelled from its records' positions so that one sent
# again is refused as already loaded. A second pipeline reads a Doris
# table back by a cursor column, for a report's copy elsewhere. The tables
# are yours. MYSQL_PASSWORD and DORIS_PASSWORD hold the passwords. Run it
# from the repository's root:
#   MYSQL_PASSWORD=... DORIS_PASSWORD=... fit run -c sync-mysql-to-doris/fit.conf
# 在 Apache Doris（或 StarRocks，flavor 设为 starrocks）中保持 MySQL 的表：
# binlog 的插入、更新和删除经 Stream Load 写入 Doris 唯一键模型的表，删除经
# 其删除标记，每次导入的 label 由其记录的位置生成，所以再次发送的导入会以已
# 导入为由被拒绝。第二条流水线按游标列读回一张 Doris 表，用于在别处保存报表
# 的副本。表由你创建。MYSQL_PASSWORD 和 DORIS_PASSWORD 保存密码。在仓库根目录
# 运行：
#   MYSQL_PASSWORD=... DORIS_PASSWORD=... fit run -c sync-mysql-to-doris/fit.conf
sync {
	state_dir /tmp/fit-example-sync

	pipelines shop-to-doris {
		source mysql {
			address mysql.internal:3306
			username repl
			password_env MYSQL_PASSWORD
			server_id 4301
			tables shop.orders shop.order_items
		}
		sinks doris {
			sink doris {
				urls http://doris-fe-1:8030 http://doris-fe-2:8030
				username fit
				password_env DORIS_PASSWORD
				flavor doris
				table "{namespace}"
				format json
			}
			batch { max_records 20000; max_wait 2s }
		}
	}

	pipelines report-copy {
		source doris {
			address doris-fe-1:9030
			username fit
			password_env DORIS_PASSWORD
			table report.daily
			key day region
			cursor updated_at
			poll_interval 1m
		}
		sinks out { sink file { path /tmp/fit-example-sync/daily.jsonl; codec json } }
	}
}

admin { address 127.0.0.1:2019 }
