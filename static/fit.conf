# A static file server: files from static/www, directory listings,
# precompressed twins (index.html.br, .zst or .gz, when they are there) and
# small files kept in memory.
# Run it from the repository's root: fit run -c static/fit.conf
# 一个静态文件服务器：提供 static/www 中的文件、目录列表、预压缩副本
# （index.html.br、.zst 或 .gz，存在时）以及保存在内存中的小文件。
# 在仓库根目录运行：fit run -c static/fit.conf
listener web :8080 http/1.1 h2c

route files {
	# Compress what has no precompressed twin.
	# 压缩没有预压缩副本的内容。
	middleware compress
	handler static {
		# Relative to the directory fit runs in.
		# 相对于 fit 运行时所在的目录。
		root static/www
		index index.html
		# Serve index.html.br or index.html.gz in place of index.html when
		# the client takes it.
		# 客户端接受时，用 index.html.br 或 index.html.gz 代替 index.html。
		precompressed br zstd gzip
		# List a directory without an index file, as /docs/.
		# 列出没有 index 文件的目录，如 /docs/。
		browse true
		# Keep files up to 256 KiB in memory, 32 MiB of them in all.
		# 将不超过 256 KiB 的文件保存在内存中，总计 32 MiB。
		max_file_bytes 256KiB
		max_cache_bytes 32MiB
		# A change on disk shows within this.
		# 磁盘上的变更在此时间内生效。
		check_interval 2s
	}
}
