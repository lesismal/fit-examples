# SQL Server's changes to Kafka, as Debezium's SQL Server connector sends
# them: a snapshot of the captured tables without locks, then their
# changes from CDC's change tables, polled by LSN, each transaction's
# together, the LSN in the checkpoint, each table to a topic of its own in
# Debezium's format. CDC must be on for the database and the tables (the
# source's error says how); SQL Server Agent runs CDC's capture job.
# MSSQL_PASSWORD and KAFKA_PASSWORD hold the passwords. Run it from the
# repository's root:
#   MSSQL_PASSWORD=... KAFKA_PASSWORD=... fit run -c sync-mssql-to-kafka/fit.conf
# SQL Server 的变更写入 Kafka，就像 Debezium 的 SQL Server 连接器那样：先无锁
# 地读被捕获表的快照，再按 LSN 轮询 CDC 变更表读取其变更，每个事务的变更放在
# 一起，LSN 保存在检查点里，每张表写到自己的主题，采用 Debezium 格式。数据库和
# 表需开启 CDC（源的报错会说明怎样开启）；CDC 的捕获作业由 SQL Server Agent
# 运行。MSSQL_PASSWORD 和 KAFKA_PASSWORD 保存密码。在仓库根目录运行：
#   MSSQL_PASSWORD=... KAFKA_PASSWORD=... fit run -c sync-mssql-to-kafka/fit.conf
sync {
	state_dir /tmp/fit-example-sync

	pipelines shop-cdc {
		source mssql {
			address mssql.internal:1433
			username fit_cdc
			password_env MSSQL_PASSWORD
			database shop
			# TLS on, the server's certificate checked against the
			# system's roots or ca_file's.
			# 开启 TLS，按系统根证书或 ca_file 中的证书校验服务器证书。
			encrypt on
			tables dbo.orders dbo.order_items
			mode cdc
			snapshot initial
			poll_interval 1s
		}
		sinks kafka {
			sink kafka {
				brokers kafka-1:9093 kafka-2:9093
				tls true
				sasl SCRAM-SHA-512
				username fit
				password_env KAFKA_PASSWORD
				topic cdc.{namespace}
				codec debezium
			}
			batch { max_records 2000; max_wait 200ms }
		}
	}
}

admin { address 127.0.0.1:2019 }
