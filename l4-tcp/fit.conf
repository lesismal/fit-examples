# Layer 4 TCP proxying: PostgreSQL passed through byte for byte to a primary
# and a standby, and TLS on 443 routed by SNI without being terminated, one
# service's upstream told the client's address with a PROXY header.
# Run it from the repository's root: fit run -c l4-tcp/fit.conf
# 四层 TCP 代理：PostgreSQL 逐字节透传到一个主库和一个备库；443 上的 TLS
# 按 SNI 路由而不终止，其中一个服务的上游通过 PROXY 头得知客户端地址。
# 在仓库根目录运行：fit run -c l4-tcp/fit.conf
listener postgres :5432 tcp
listener tls :443 tcp

upstream db 10.0.0.21:5432 10.0.0.22:5432 {
	connect_timeout 3s
	# A TCP check: the port accepts connections.
	# TCP 检查：端口能接受连接即可。
	health_check { type tcp; interval 5s }
}

upstream mail 10.0.0.31:443
upstream web 10.0.0.41:443 10.0.0.42:443

service postgres {
	listeners postgres
	upstream db
	idle_timeout 1h
	max_conns 2000
}

# TLS whose ClientHello asks for mail.example.com goes to mail...
# ClientHello 请求 mail.example.com 的 TLS 发往 mail……
service mail { listeners tls; upstream mail; server_names mail.example.com }

# ...and every other name, or none, to web, with a PROXY v2 header first.
# ……其他任何名称（或没有名称）发往 web，并先发送一个 PROXY v2 头。
service web { listeners tls; upstream web; proxy_protocol v2 }
