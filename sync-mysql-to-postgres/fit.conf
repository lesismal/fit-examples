# MySQL's tables kept in PostgreSQL, exactly once: a snapshot of shop's
# tables without locks, then the binlog read as a replica, each MySQL
# transaction written as one PostgreSQL transaction together with the
# pipeline's position, so a crash between the two writes no row twice.
# MySQL needs binlog_format = ROW, binlog_row_image = FULL and GTIDs on, and
# a user with REPLICATION SLAVE, REPLICATION CLIENT and SELECT; PostgreSQL
# the tables, in a schema shop, each with the MySQL table's primary key.
# MYSQL_PASSWORD and PG_PASSWORD hold the passwords. Run it from the
# repository's root:
#   MYSQL_PASSWORD=... PG_PASSWORD=... fit run -c sync-mysql-to-postgres/fit.conf
# 在 PostgreSQL 中保持 MySQL 的表，且恰好一次：先无锁地读 shop 各表的快照，
# 再以副本身份读 binlog，每个 MySQL 事务连同流水线的位置写成一个 PostgreSQL
# 事务，所以两者之间的崩溃不会让任何一行写两次。MySQL 需要
# binlog_format = ROW、binlog_row_image = FULL 并开启 GTID，用户需有
# REPLICATION SLAVE、REPLICATION CLIENT 和 SELECT 权限；PostgreSQL 中需在
# shop 模式下建好这些表，主键与 MySQL 表相同。MYSQL_PASSWORD 和 PG_PASSWORD
# 保存密码。在仓库根目录运行：
#   MYSQL_PASSWORD=... PG_PASSWORD=... fit run -c sync-mysql-to-postgres/fit.conf
sync {
	state_dir /tmp/fit-example-sync

	pipelines shop-replica {
		source mysql {
			address mysql.internal:3306
			username fit_repl
			password_env MYSQL_PASSWORD
			tls true
			# Unique among the server's replicas.
			# 在该服务器的所有副本中唯一。
			server_id 4101
			# Globs of db.table.
			# db.table 形式的通配符。
			tables shop.*
			# The rows there first, when the pipeline has no checkpoint.
			# 流水线没有检查点时，先读已有的行。
			snapshot initial
		}
		sinks replica {
			sink postgres {
				address pg.internal:5432
				user fit
				password_env PG_PASSWORD
				database replica
				# shop.orders is the table orders of the schema shop.
				# shop.orders 即 shop 模式下的 orders 表。
				table "{namespace}"
				# The position kept in _fit_sync_checkpoints, in the same
				# transaction as the rows: exactly once.
				# 位置保存在 _fit_sync_checkpoints 中，与数据行在同一个
				# 事务里：恰好一次。
				checkpoint sink
				transactions source
			}
			batch { max_records 1000; max_wait 200ms }
		}
		# MySQL's DDL is reported, not applied: change the table in
		# PostgreSQL yourself.
		# MySQL 的 DDL 只报告，不执行：请自行修改 PostgreSQL 中的表。
	}
}

