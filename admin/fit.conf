# The Admin API: read and replace the running config, read its history,
# health and metrics, and the read-only dashboard at /dashboard/. On a Unix
# socket here; a TCP address off loopback needs token_file.
# Run it from the repository's root: fit run -c admin/fit.conf
# Try it: curl --unix-socket /tmp/fit-admin.sock http://fit/config
# Admin API：读取和替换运行中的配置，读取其历史、健康状态和指标，以及位于
# /dashboard/ 的只读仪表盘。这里使用 Unix socket；非回环的 TCP 地址需要
# token_file。
# 在仓库根目录运行：fit run -c admin/fit.conf
# 试一下：curl --unix-socket /tmp/fit-admin.sock http://fit/config
listener web :8080 http/1.1 h2c

route hello { handler respond { body "hello\n" } }

admin {
	# "unix/" and a socket's path; "127.0.0.1:2019" when left out.
	# "unix/" 加 socket 的路径；省略时为 "127.0.0.1:2019"。
	address unix//tmp/fit-admin.sock
	# Configs kept to be read back or rolled back to.
	# 保留的配置，可供读回或回滚。
	history 20
	max_config_bytes 4MiB
	max_conns 16
}
