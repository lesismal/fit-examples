# Routes and upstreams from the Consul catalog: services tagged
# fit.enable=true and fit.routes.web.host=..., sent to their instances whose
# health checks pass.
# Run it from the repository's root: fit run -c provider-consul/fit.conf
# 来自 Consul catalog 的路由和上游：带有 fit.enable=true 和
# fit.routes.web.host=... 标签的服务，发往其健康检查通过的实例。
# 在仓库根目录运行：fit run -c provider-consul/fit.conf
listener web :8080 http/1.1 h2c

provider consul {
	consul {
		endpoint http://127.0.0.1:8500
		datacenter dc1
		# An ACL token that may read the services; not in this directory.
		# 一个可以读取这些服务的 ACL token；不在本目录中。
		token_file /etc/fit/consul-token
		tag_prefix fit
		max_services 1000
		refresh_interval 30s
	}
}
