# JSON Web Tokens: requests to /api/ need a bearer token signed by a key of
# the identity provider's JWK set, with its issuer and audience; claims are
# passed on to the upstream as request fields.
# Run it from the repository's root: fit run -c jwt/fit.conf
# JSON Web Token：发往 /api/ 的请求需要一个 bearer token，由身份提供方
# JWK 集合中的某个密钥签名，并带有其 issuer 和 audience；claims 作为请求
# 字段传给上游。
# 在仓库根目录运行：fit run -c jwt/fit.conf
listener web :8080 http/1.1 h2c

upstream api 127.0.0.1:9000

route api {
	match { path /api/* }
	middleware jwt {
		# Keys are fetched from here, and again every hour, or sooner for
		# a token naming a key the set does not have yet.
		# 密钥从这里获取，之后每小时重新获取一次；若 token 指名的密钥在集合中
		# 还没有，则会提前获取。
		jwks_url https://auth.example.com/.well-known/jwks.json
		jwks_refresh_interval 1h
		algorithms RS256 ES256
		issuer https://auth.example.com/
		audience api
		# Clocks may differ by this much.
		# 允许时钟相差这么多。
		leeway 30s
		# Authorization: Bearer <token>; "cookie:session" reads a cookie.
		# Authorization: Bearer <token>；"cookie:session" 则读取一个 cookie。
		token_from header
		claims_headers { X-User sub; X-Scope scope }
	}
	handler proxy { upstream api }
}
