# Header fields: security headers on every response, internal fields removed
# on the way out, and fields set on the request the upstream gets.
# Run it from the repository's root: fit run -c headers/fit.conf
# 头字段：为每个响应加上安全头，在出站时移除内部字段，并在上游收到的请求上
# 设置字段。
# 在仓库根目录运行：fit run -c headers/fit.conf
listener web :8080 http/1.1 h2c

upstream app 127.0.0.1:9000

route app {
	middleware headers {
		request {
			set { X-Env production }
			# Never trust a client's own.
			# 绝不信任客户端自己带的。
			delete X-Internal-*
		}
		response {
			set {
				Strict-Transport-Security "max-age=31536000; includeSubDomains"
				X-Content-Type-Options nosniff
				Referrer-Policy strict-origin-when-cross-origin
			}
			add { Vary Accept-Encoding }
			delete Server X-Powered-By X-Debug-*
		}
	}
	handler proxy { upstream app }
}
