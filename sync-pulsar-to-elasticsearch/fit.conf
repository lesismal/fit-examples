# Apache Pulsar's partitioned topic into Elasticsearch: each partition read
# by a reader from the message IDs in the checkpoint, so no subscription is
# needed and a restart resumes where the index's writes ended; JSON
# messages become documents by their id. A second pipeline copies MySQL's
# changes into a Pulsar topic, keyed by the row's key for its partition,
# with sequence IDs from their positions, which the broker's deduplication
# uses to drop a batch sent again. PULSAR_TOKEN, ES_PASSWORD and
# MYSQL_PASSWORD hold the credentials. Run it from the repository's root:
#   PULSAR_TOKEN=... ES_PASSWORD=... MYSQL_PASSWORD=... fit run -c sync-pulsar-to-elasticsearch/fit.conf
# Apache Pulsar 的分区主题写入 Elasticsearch：每个分区由一个 reader 从检查点中
# 的消息 ID 读取，所以不需要订阅，重启后从索引写入结束处继续；JSON 消息按其 id
# 成为文档。第二条流水线把 MySQL 的变更复制到一个 Pulsar 主题，以行的键作为
# 分区键，序列 ID 来自其位置，broker 的去重据此丢弃再次发送的批次。
# PULSAR_TOKEN、ES_PASSWORD 和 MYSQL_PASSWORD 保存凭据。在仓库根目录运行：
#   PULSAR_TOKEN=... ES_PASSWORD=... MYSQL_PASSWORD=... fit run -c sync-pulsar-to-elasticsearch/fit.conf
sync {
	state_dir /tmp/fit-example-sync

	pipelines events-to-search {
		source pulsar {
			url pulsar+ssl://pulsar.internal:6651
			token_env PULSAR_TOKEN
			topics persistent://public/default/events
			mode reader
			codec json
		}
		sinks search {
			sink elasticsearch {
				urls https://es-1:9200
				username fit
				password_env ES_PASSWORD
				index events
			}
		}
	}

	pipelines shop-to-pulsar {
		source mysql {
			address mysql.internal:3306
			username repl
			password_env MYSQL_PASSWORD
			server_id 4201
			tables shop.orders
		}
		sinks pulsar {
			sink pulsar {
				url pulsar+ssl://pulsar.internal:6651
				token_env PULSAR_TOKEN
				topic persistent://public/default/shop-orders
				codec debezium
			}
		}
	}
}

admin { address 127.0.0.1:2019 }
