# gRPC: calls taken over HTTP/2 (h2c here, h2 with tls) and proxied to a gRPC
# server over HTTP/2 in the clear, streams and trailers passed through.
# Run it from the repository's root: fit run -c grpc/fit.conf
# gRPC：通过 HTTP/2 接收调用（这里是 h2c，配合 tls 则是 h2），并以明文 HTTP/2
# 代理到 gRPC 服务器，流和 trailer 原样透传。
# 在仓库根目录运行：fit run -c grpc/fit.conf
listener grpc :8080 h2c

upstream greeter 127.0.0.1:50051 {
	# gRPC servers speak HTTP/2; h2 for one over TLS.
	# gRPC 服务器使用 HTTP/2；基于 TLS 的则用 h2。
	protocol h2c
	# Streaming calls may stay quiet a long time.
	# 流式调用可能长时间没有数据。
	response_idle_timeout 10m
	response_timeout 1h
	health_check { type tcp; interval 5s }
}

# A service's methods are paths: /package.Service/Method.
# 服务的方法就是路径：/package.Service/Method。
route greeter {
	match { path /helloworld.Greeter/* }
	handler proxy { upstream greeter }
}
