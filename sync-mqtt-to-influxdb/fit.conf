# Devices' readings from MQTT into InfluxDB, the IoT pipeline: JSON
# messages on sensors/<site>/<device> at QoS 1, kept by the source's
# persistent session while fit is away and acknowledged only once InfluxDB
# has them, written as points of the measurement readings, tagged by
# device and site, at the time the device stamped. A point is its series
# and time, so a reading written again is the same point. Alerts go back
# out on MQTT. MQTT_PASSWORD and INFLUX_TOKEN hold the credentials. Run it
# from the repository's root:
#   MQTT_PASSWORD=... INFLUX_TOKEN=... fit run -c sync-mqtt-to-influxdb/fit.conf
# 设备读数从 MQTT 写入 InfluxDB，即物联网流水线：sensors/<site>/<device> 上
# QoS 1 的 JSON 消息，fit 不在时由源的持久会话保留，只在 InfluxDB 拿到后才
# 确认，写成 readings 测量的数据点，以 device 和 site 为标签，时间为设备打上
# 的时间。数据点由其序列和时间确定，所以同一读数再写一次仍是同一个数据点。
# 告警经 MQTT 发回。MQTT_PASSWORD 和 INFLUX_TOKEN 保存凭据。在仓库根目录运行：
#   MQTT_PASSWORD=... INFLUX_TOKEN=... fit run -c sync-mqtt-to-influxdb/fit.conf
sync {
	state_dir /tmp/fit-example-sync

	pipelines readings {
		source mqtt {
			servers mqtt.internal:8883
			tls true
			client_id fit-readings
			username fit
			password_env MQTT_PASSWORD
			topics sensors/+/+
			qos 1
			codec json
		}
		sinks influx {
			sink influxdb {
				url https://influxdb.internal:8086
				org iot
				bucket readings
				token_env INFLUX_TOKEN
				measurement readings
				tags device site
				fields temperature humidity
				time_field at
				precision ms
			}
			batch { max_records 5000; max_wait 1s }
		}
	}

	pipelines alerts {
		source generate { namespace alerts; records 3 }
		sinks mqtt {
			sink mqtt {
				servers mqtt.internal:8883
				tls true
				username fit
				password_env MQTT_PASSWORD
				topic alerts/{namespace}
				qos 1
				codec json
			}
		}
	}
}

admin { address 127.0.0.1:2019 }
