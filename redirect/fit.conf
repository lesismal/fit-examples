# Redirects: a moved section, permanently, keeping the rest of the path; an
# old host name to the new one; and the rest answered as usual.
# Run it from the repository's root: fit run -c redirect/fit.conf
# Try it: curl -i http://127.0.0.1:8080/blog/2024/hello
listener web :8080 http/1.1 h2c

route old-host {
	match { host old.example.com }
	middleware redirect { to https://www.example.com{uri}; status 301 }
	handler respond { status 404 }
}

# Requests the regexp does not match go on to the handler.
route moved {
	middleware redirect { regexp ^/blog/(.*)$; to /articles/$1; status 308 }
	handler respond { body "not moved\n" }
}
