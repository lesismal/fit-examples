# Routes and upstreams from the labels of running Docker containers, as
# fit.routes.web.host=app.example.com; a container must be labelled
# fit.enable=true to be taken. docker-compose runs this in Compose.
# Run it from the repository's root: fit run -c provider-docker/fit.conf
# 来自运行中 Docker 容器标签的路由和上游，如
# fit.routes.web.host=app.example.com；容器必须带有 fit.enable=true 标签
# 才会被采用。docker-compose 在 Compose 中运行本配置。
# 在仓库根目录运行：fit run -c provider-docker/fit.conf
listener web :8080 http/1.1 h2c

# What this file writes wins over the provider's: here, only a fallback.
# 本文件所写的内容优先于 provider 的：这里只是一个兜底。
route not-found {
	priority -1
	handler respond { status 404; body "no container serves this\n" }
}

provider docker {
	docker {
		endpoint unix:///var/run/docker.sock
		# The network whose container addresses fit sends to.
		# fit 发往其容器地址的网络。
		network web
		# Labels read start with this, as fit.routes.<name>.host.
		# 读取的标签以此开头，如 fit.routes.<name>.host。
		label_prefix fit
		max_containers 1000
		refresh_interval 30s
	}
}
