# An HTTP CONNECT forward proxy for the clients of one network, to HTTPS
# sites only, with the cloud metadata address refused.
# Run it from the repository's root: fit run -c forward-proxy/fit.conf
# Try it: curl -x http://127.0.0.1:3128 https://example.com/
# 供某个网络内客户端使用的 HTTP CONNECT 正向代理，只连接 HTTPS 站点，并拒绝
# 云元数据地址。
# 在仓库根目录运行：fit run -c forward-proxy/fit.conf
# 试一下：curl -x http://127.0.0.1:3128 https://example.com/
listener proxy :3128 http/1.1

route connect {
	match { method CONNECT }
	handler forward_proxy {
		# Who may use it.
		# 谁可以使用它。
		clients 127.0.0.1/32 10.0.0.0/8
		# Where it connects: anything but these.
		# 它可以连接的目标：除这些之外的任何地址。
		deny 169.254.169.254 10.0.0.0/8
		ports 443
		connect_timeout 10s
		idle_timeout 5m
	}
}

route not-connect {
	priority -1
	handler respond { status 405; body "CONNECT only\n" }
}
