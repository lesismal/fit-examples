# Request body limits: 100 MiB for uploads, 64 KiB for the JSON API, and
# 16 MiB for everything else from limits.max_body_bytes; past a limit, 413.
# Run it from the repository's root: fit run -c body-limit/fit.conf
# 请求体限制：上传为 100 MiB，JSON API 为 64 KiB，其他一律取 limits.max_body_bytes
# 的 16 MiB；超过限制返回 413。
# 在仓库根目录运行：fit run -c body-limit/fit.conf
listener web :8080 http/1.1 h2c

# Every listener's limit; a route's body_limit may set its own, higher or lower.
# 所有监听器的限制；路由的 body_limit 可以设置自己的值，更高或更低均可。
limits { max_body_bytes 16MiB }

upstream app 127.0.0.1:9000

route uploads {
	match { path /upload/*; method POST PUT }
	middleware body_limit { max_bytes 100MiB }
	handler proxy { upstream app }
}

route api {
	match { path /api/* }
	middleware body_limit { max_bytes 64KiB }
	handler proxy { upstream app }
}

route rest { priority -1; handler proxy { upstream app } }
