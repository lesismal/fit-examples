# Response compression: zstd, brotli or gzip, whichever the client prefers,
# for bodies of 1 KiB or more, at most 512 responses at once.
# Run it from the repository's root: fit run -c compress/fit.conf
# Try it: curl -H 'Accept-Encoding: zstd, gzip' -i http://127.0.0.1:8080/
# 响应压缩：zstd、brotli 或 gzip，取客户端偏好的那一种，用于 1 KiB 及以上的
# 响应体，同时最多压缩 512 个响应。
# 在仓库根目录运行：fit run -c compress/fit.conf
# 试一下：curl -H 'Accept-Encoding: zstd, gzip' -i http://127.0.0.1:8080/
listener web :8080 http/1.1 h2c

upstream app 127.0.0.1:9000

route app {
	middleware compress {
		# Among those the client prefers equally, the first listed.
		# 客户端同等偏好的编码中，取列在最前面的。
		encodings zstd br gzip
		level default
		min_bytes 1KiB
		# Bounds the compressors' memory; past it, responses go uncompressed.
		# 限制压缩器的内存；超过后，响应不压缩直接发送。
		max_in_flight 512
	}
	handler proxy { upstream app }
}
